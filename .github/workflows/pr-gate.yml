name: PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Lean proof and trust gate
        run: uv run --no-project python scripts/verify-lean.py

      - name: Preserve proof reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-proof-reports
          path: .lake/reports/

      - name: Review exporter smoke
        run: |
          for file in scripts/export-payment-review.lean scripts/export-webhook-network.lean scripts/export-omitted-mapping-fixture.lean; do
            if ! lake env lean --run "$file" > /tmp/archiscript-export.out; then
              cat /tmp/archiscript-export.out
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python repository tests
        run: uv run --no-project python -m unittest discover -s scripts -p "test_*.py"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Webhook implementation tests
        run: node --test examples/payment-webhook.test.mjs
